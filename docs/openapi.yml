  /api/tours/:
    get:
      operationId: tours_list
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      tags:
      - tours
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tour'
          description: ''
    post:
      operationId: tours_create
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      tags:
      - tours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tour'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
          description: ''
  /api/tours/{id}/:
    get:
      operationId: tours_retrieve
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tour.
        required: true
      tags:
      - tours
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
          description: ''
    put:
      operationId: tours_update
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tour.
        required: true
      tags:
      - tours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tour'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
          description: ''
    patch:
      operationId: tours_partial_update
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tour.
        required: true
      tags:
      - tours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTour'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
          description: ''
    delete:
      operationId: tours_destroy
      description: 'Туры. Фильтр по категории: ``?category=<id>``. Изменять может
        только админ.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tour.
        required: true
      tags:
      - tours
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Booking:
      type: object
      description: Покупка тура. Клиент берётся из request.user.
      properties:
        id:
          type: integer
          readOnly: true
        tour:
          type: integer
        date:
          type: string
          format: date
          title: Дата
        time:
          type: string
          format: time
          title: Время
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - time
      - tour
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 50
      required:
      - id
      - name
    Comment:
      type: object
      description: Комментарий. Оставить можно только к туру, в котором клиент уже
        был.
      properties:
        id:
          type: integer
          readOnly: true
        tour:
          type: integer
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        text:
          type: string
          title: Текст
        rating:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Оценка
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - id
      - text
      - tour
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        phone:
          type: string
          title: Телефон
          maxLength: 20
      required:
      - id
      - username
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 50
    PatchedTour:
      type: object
      description: Тур. Категории передаются списком id (многие ко многим).
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 120
        description:
          type: string
          title: Описание
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Цена
        categories:
          type: array
          items:
            type: integer
    Register:
      type: object
      description: 'Регистрация: создаёт User и связанного Customer (1-1).'
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        phone:
          type: string
          maxLength: 20
      required:
      - password
      - username
    Tour:
      type: object
      description: Тур. Категории передаются списком id (многие ко многим).
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 120
        description:
          type: string
          title: Описание
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Цена
        categories:
          type: array
          items:
            type: integer
      required:
      - categories
      - id
      - price
      - title
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
